// ==========================================================================
// QuickGrenade & BotQuickGrenade 武器物理与战术配置文件
//
// 全局 Settings 段（兼容加枪武器）：
//   viewmodel_fix_mode : 视图修复模式
//                        0=不干预（原版 / HAN 武器框架）；
//                        1=统统藏 1 号亮 0 号（老加枪+老机瞄）；
//                        2=仅原版三雷藏 1 显 0，加枪等其他类名直接放行（新加枪+新机瞄）
//
// 大多数情况下无需配置，系统会自动根据底层弹药类型给出完善的默认值兜底。
// 需要配置的两种情形：
// 1. 改了手雷物理（引信/碰撞/重力/速度，如燃烧瓶、RPG）；
// 2. 只改战术定位不改物理（如抗战整合包闪光弹当高爆用，配一个 role 即可）。
// 在下方为对应武器类名添加个性化参数。
//
// 可选字段说明（未配置的字段自动继承对应角色的原版默认值；数值填 0 等同未配，唯 gravity 可填 0 关重力）：
//   role          : 战术角色，可选 he (高爆) / flash (闪光) / smoke (烟雾)
//   detonate      : 引爆机制，可选 fuse (延时引信) / touch (触碰即炸)
//   detonate_time : 引信时长（秒），原版手雷均为 1.5；触碰模式无引信，该值仅作仿真飞行上界
//   gravity       : 重力倍率（相对于 sv_gravity，原版手雷为 0.4，直飞设为 0.0）
//   speed_mode    : 速度模式，可选 engine (原版仰角公式) / fixed (固定初速度；重力≤0.05 且配了 speed 而未写本项时自动按 fixed 处理）
//   speed         : 初速度上限或固定初速度（默认 750.0）
//   radius        : 效果外圈半径（小于理论伤害范围即可，可以适当缩小以预测伤害效果，见范例）
//   safe_dist     : 安全距离，低于该距离不扔（防自伤；HE 默认 350，flash/smoke 默认 0.0，flash的“安全距离”由 BotQuickGrenade 全局变量决定，无法在此配置）
//   range         : 理论射程，超过该距离 Bot 直接放弃求解（默认 953，长程武器如 RPG 可放宽）
//
// 配置重载：修改后换图生效
// ==========================================================================
"QuickGrenadeWeapons"
{
    // 全局 Settings 段
    "Settings"
    {
        "viewmodel_fix_mode"  "0"         // 视图修复模式
    }

    // 范例 1：燃烧瓶 (触碰即炸：StartTouch 触发，中心+四角±30 共 5 团 env_fire×firesize 50)
    "weapon_molotov"
    {
        "role"              "he"
        "detonate"          "touch"       // 触地即炸
        "detonate_time"     "5.0"         // 触碰无引信，此值是仿真飞行上界（必填，不填按 1.5 截断射程）
        "radius"            "92.0"        // 火场覆盖（四角 42.4＋单团 50）
        "safe_dist"         "92.0"        // 与效果圈同值：火不分敌我，进圈就烧
        "range"             "1843.0"      // 无引信，第一落点即炸（仰角≈44°，平地）
    }

    // 范例 2：火箭筒 (homingmissiles.sp，按 missile_* 默认值推导：damage 300→被引擎截到 250，
    //         radius 800，speed 1400；改 convar 必重算。type 0 无制导直线可用，type 1/2 追踪制导 Bot 直接跳过)
    "weapon_rpg"
    {
        "role"              "he"
        "detonate"          "touch"       // OnStartTouch 即炸
        "detonate_time"     "3.0"         // 触碰无引信，此值是仿真飞行上界（必填，不填按 1.5 截断射程）
        "gravity"           "0.0"         // MOVETYPE_FLY 无重力
        "speed_mode"        "fixed"       // 每 think 重置初速，恒定（跟随 missile_speed）
        "speed"             "1400.0"      // 跟随 missile_speed（默认 1400，可配 300~3000）
        "radius"            "478.0"       // 50血线（250威力/800半径高斯下）
        "safe_dist"         "800.0"       // 物理边缘，界外零自伤（纯远程武器）
        "range"             "4200.0"      // 无物理上限（飞到碰墙为止），按地图尺度取，酌情
    }

    // 范例 3：双插件叠加的原版高爆雷（引信 2.5s × 威力 200 × 半径 400，
    //         如 Rocket HE 类改引信 × snlite 改威力半径；以下数值全由此三数推导，改输入必重算）
    "weapon_hegrenade"
    {
        "role"              "he"
        "detonate"          "fuse"
        "detonate_time"     "2.5"         // 延长引信
        "radius"            "222.0"       // 50血线（200威力/400半径下）
        "safe_dist"         "400.0"       // 物理边缘 400，界外零自伤
        "range"             "1570.0"      // 引信 2.5s 对应理论射程（仰角≈31°，不填会沿用 953 默认误杀远目标）
    }
}
